<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Converse</title>
  <desc id="d">Agentes de IA com base de conhecimento própria, publicados no Telegram e em um chat embutido.</desc>
  <style>
    .f-ac { fill: #2563eb; } .s-ac { stroke: #2563eb; }
    .f-acsoft { fill: #dbeafe; } .s-acsoft { stroke: #dbeafe; }
    .f-bg { fill: #fafafa; } .s-bg { stroke: #fafafa; }
    .f-fg { fill: #18181b; } .s-fg { stroke: #18181b; }
    .f-line { fill: #e4e4e7; } .s-line { stroke: #e4e4e7; }
    .f-mut { fill: #71717a; } .s-mut { stroke: #71717a; }
    .f-panel { fill: #ffffff; } .s-panel { stroke: #ffffff; }
    .f-soft { fill: #f4f4f5; } .s-soft { stroke: #f4f4f5; }
    @media (prefers-color-scheme: dark) {
      .f-ac { fill: #60a5fa; } .s-ac { stroke: #60a5fa; }
      .f-acsoft { fill: #1e3a8a; } .s-acsoft { stroke: #1e3a8a; }
      .f-bg { fill: #09090b; } .s-bg { stroke: #09090b; }
      .f-fg { fill: #fafafa; } .s-fg { stroke: #fafafa; }
      .f-line { fill: #27272a; } .s-line { stroke: #27272a; }
      .f-mut { fill: #a1a1aa; } .s-mut { stroke: #a1a1aa; }
      .f-panel { fill: #18181b; } .s-panel { stroke: #18181b; }
      .f-soft { fill: #27272a; } .s-soft { stroke: #27272a; }
    }
    .titulo { font: italic 400 84px Georgia, 'Instrument Serif', 'Times New Roman', serif; }
    .sub { font: 500 20px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .chip { font: 500 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .msg { font: 500 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect width="1280" height="360" rx="24" class="f-bg"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" fill="none" class="s-line"/>

  <!-- grade de pontos -->
  <g class="f-line">
    <circle cx="40" cy="40" r="1.6"/><circle cx="80" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/>
    <circle cx="40" cy="80" r="1.6"/><circle cx="80" cy="80" r="1.6"/><circle cx="120" cy="80" r="1.6"/>
  </g>

  <!-- marca -->
  <g transform="translate(72 96)">
    <rect width="64" height="64" rx="16" class="f-fg"/>
    <path d="M16 16h26a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6H30l-8 7v-7h-6a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z" class="f-bg"/>
    <path d="M34 28h14a6 6 0 0 1 6 6v7a6 6 0 0 1-6 6h-2v6l-7-6h-5a6 6 0 0 1-6-6v-7a6 6 0 0 1 6-6z" stroke-width="3" class="f-ac s-fg"/>
    <circle cx="23" cy="24" r="2.4" class="f-fg"/><circle cx="30" cy="24" r="2.4" class="f-fg"/><circle cx="37" cy="24" r="2.4" class="f-fg"/>
  </g>
  <text x="72" y="244" class="titulo f-fg">Converse</text>
  <text x="74" y="288" class="sub f-mut">Agentes de IA que respondem com a sua própria base de conhecimento.</text>

  <!-- chips -->
  <g transform="translate(74 310)">
    <rect width="104" height="32" rx="16" class="f-soft s-line"/><text x="52" y="21" text-anchor="middle" class="chip f-fg">Telegram</text>
    <rect x="116" width="132" height="32" rx="16" class="f-soft s-line"/><text x="182" y="21" text-anchor="middle" class="chip f-fg">Chat embutido</text>
    <rect x="260" width="116" height="32" rx="16" class="f-soft s-line"/><text x="318" y="21" text-anchor="middle" class="chip f-fg">OpenRouter</text>
  </g>

  <!-- janela de chat -->
  <g transform="translate(800 44)">
    <rect width="420" height="272" rx="18" class="f-panel s-line"/>
    <path d="M0 18a18 18 0 0 1 18-18h384a18 18 0 0 1 18 18v28H0z" class="f-soft"/>
    <line x1="0" y1="46" x2="420" y2="46" class="s-line"/>
    <circle cx="26" cy="23" r="5" class="f-line"/><circle cx="44" cy="23" r="5" class="f-line"/><circle cx="62" cy="23" r="5" class="f-line"/>
    <rect x="150" y="14" width="120" height="18" rx="9" class="f-panel s-line"/>

    <!-- mensagem do visitante -->
    <rect x="196" y="70" width="198" height="40" rx="14" class="f-fg"/>
    <text x="295" y="95" text-anchor="middle" class="msg f-bg">Qual o prazo de entrega?</text>

    <!-- resposta do agente -->
    <circle cx="36" cy="146" r="14" class="f-ac"/>
    <path d="M30 143h12a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-5l-4 3v-3h-3a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z" class="f-bg"/>
    <rect x="60" y="122" width="262" height="62" rx="14" class="f-soft s-line"/>
    <rect x="76" y="138" width="226" height="7" rx="3.5" opacity=".55" class="f-mut"/>
    <rect x="76" y="154" width="180" height="7" rx="3.5" opacity=".55" class="f-mut"/>
    <rect x="76" y="170" width="120" height="7" rx="3.5" opacity=".35" class="f-mut"/>

    <!-- fonte citada -->
    <g transform="translate(60 196)">
      <rect width="148" height="28" rx="14" class="f-acsoft"/>
      <path d="M14 7h7l4 4v10a1 1 0 0 1-1 1H14a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke-width="1.6" stroke-linejoin="round" class="s-ac"/>
      <text x="34" y="19" class="msg f-ac" style="font-size:13px">politica-de-entrega.pdf</text>
    </g>

    <!-- campo de texto -->
    <rect x="16" y="234" width="388" height="28" rx="14" class="f-bg s-line"/>
    <rect x="32" y="244" width="110" height="8" rx="4" class="f-line"/>
    <circle cx="386" cy="248" r="10" class="f-fg"/>
    <path d="M382 248h8m-3-3.5 3.5 3.5-3.5 3.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="s-bg"/>
  </g>

  <!-- documentos flutuando -->
  <g transform="translate(700 70) rotate(-8)">
    <rect width="64" height="80" rx="8" class="f-panel s-line"/>
    <rect x="12" y="16" width="40" height="5" rx="2.5" opacity=".5" class="f-mut"/>
    <rect x="12" y="28" width="32" height="5" rx="2.5" opacity=".5" class="f-mut"/>
    <rect x="12" y="40" width="36" height="5" rx="2.5" opacity=".5" class="f-mut"/>
    <rect x="12" y="58" width="22" height="10" rx="3" class="f-ac"/>
  </g>
  <g transform="translate(724 220) rotate(6)">
    <rect width="64" height="80" rx="8" class="f-panel s-line"/>
    <path d="M24 28l22 12-22 12z" class="f-ac"/>
    <rect x="12" y="62" width="40" height="5" rx="2.5" opacity=".5" class="f-mut"/>
  </g>
  <path d="M770 150c18 6 22 22 28 34" fill="none" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" class="s-mut"/>
  <path d="M790 260c4-18 4-28 10-38" fill="none" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" class="s-mut"/>
</svg>
